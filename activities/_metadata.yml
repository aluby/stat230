subtitle: "Stat 230 - Spring 2026"
engine: knitr
navbar: false
execute:
  freeze: auto
  echo: true
  warning: false
  message: false
knitr:
    opts_chunk: 
      dev: "ragg_png"
format:
  pdf:
    pdf-engine: lualatex
    mainfont: "Source Sans 3"
    monofont: "Monaco"
    fontsize: 12pt
    linestretch: 1.15
    toc: false
    number-sections: true
    colorlinks: true
    urlcolor: blue
    linkcolor: blue
    geometry:
      - top=1in
      - left=1in
      - right=1in
      - bottom=1in
      - heightrounded
    highlight-style: arrow
  html: 
    toc: true
    urlcolor: blue
    code_download: true
    code-tools: true
    
